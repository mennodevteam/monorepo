@if (title) {
  <h3 mat-dialog-title>{{ title }}</h3>
}
<mat-dialog-content>
  @if (description) {
    <p>
      {{ description }}
    </p>
  }
  <mat-nav-list>
    @for (item of items; track item) {
      <a mat-list-item [mat-dialog-close]="item.value">
        @if (item.iconClass) {
          <i matListIcon class="{{ item.iconClass }}"></i>
        }
        <h3 matLine>{{ item.title }}</h3>
        @if (item.subtitle) {
          <p matLine>{{ item.subtitle }}</p>
        }
      </a>
    }
  </mat-nav-list>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button type="button" [mat-dialog-close]="null">
    {{ cancelText }}
  </button>
</mat-dialog-actions>
