<form (ngSubmit)="save()">
  @if (title) {
    <h3 mat-dialog-title>{{ title }}</h3>
  }
  <mat-dialog-content>
    @if (description) {
      <p>
        {{ description }}
      </p>
    }
    <mat-form-field appearance="fill">
      @if (label) {
        <mat-label>{{ label }}</mat-label>
      }
      @if (['textarea', 'datepicker'].indexOf(type) === -1) {
        <input
          matInput
          [type]="type || 'text'"
          [(ngModel)]="value"
          [placeholder]="placeholder"
          [ngModelOptions]="{ standalone: true }"
          />
      }

      @if (type === 'textarea') {
        <textarea
          matInput
          [(ngModel)]="value"
          [placeholder]="placeholder"
          rows="{{ rows }}"
          [ngModelOptions]="{ standalone: true }"
        ></textarea>
      }

      @if (type === 'datepicker') {
        <input
          matInput
          [(ngModel)]="value"
          [placeholder]="placeholder"
          [matDatepicker]="picker"
          [ngModelOptions]="{ standalone: true }"
          [max]="max"
          />
      }
      @if (type === 'datepicker') {
        <mat-datepicker-toggle matSuffix [for]="picker">
        </mat-datepicker-toggle>
      }
      <mat-datepicker [hidden]="type !== 'datepicker'" #picker></mat-datepicker>

      @if (hint) {
        <mat-hint>{{ hint }}</mat-hint>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="submit" color="primary">
      {{ okText || ('app.ok' | translate) }}
    </button>
    <button mat-button type="button" [mat-dialog-close]="null">
      {{ cancelText || ('app.cancel' | translate) }}
    </button>
  </mat-dialog-actions>
</form>
