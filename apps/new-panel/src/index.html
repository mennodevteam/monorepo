<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>SHOTTT</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      .loader-logo {
        width: 80px;
        height: auto;
        animation: pulse-logo 2s infinite ease-in-out;
      }
      .loader-text {
        font-size: 1rem;
        font-weight: 500;
        color: #64748b;
        text-align: center;
        direction: rtl;
      }
      .loader-spinner {
        width: 32px;
        height: 4px;
        background-color: #f1f5f9;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .loader-spinner::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50%;
        background-color: #1e293b;
        border-radius: 2px;
        animation: loading-bar 1.5s infinite ease-in-out;
      }
      @keyframes pulse-logo {
        0%, 100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @keyframes loading-bar {
        0% {
          left: -50%;
        }
        50% {
          left: 25%;
          width: 60%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root>
      <div class="initial-loader">
        <div class="loader-content">
          <img src="icons/logo.svg" alt="shot" class="loader-logo" />
          <div class="loader-text">در حال دریافت اطلاعات...</div>
          <div class="loader-spinner"></div>
        </div>
      </div>
    </app-root>
  </body>
</html>
