</mat-toolbar>
@let cats = menuService.categories();
<nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false" >
  @for (cat of cats; track cat.id) {
    <a mat-tab-link (click)="setTab(cat)" [active]="selectedCategoryId() === cat.id">
      {{ cat.title }}
    </a>
  }
</nav>
<mat-tab-nav-panel #tabPanel>
  <main p-md>
    <app-menu-category [category]="category()" />
  </main>
</mat-tab-nav-panel>
