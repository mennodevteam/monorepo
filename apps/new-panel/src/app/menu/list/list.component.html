<mat-toolbar class="content-toolbar" fxLayoutGap="8px">
  <h1 fxFlex>{{ 'menu.title' | translate }}</h1>
</mat-toolbar>
@let cats = menuService.categories();
@if (cats && cats.length > 0) {
  <nav mat-tab-nav-bar [tabPanel]="tabPanel" mat-stretch-tabs="false">
    @for (cat of cats; track cat.id) {
      <a mat-tab-link (click)="setTab(cat)" [active]="selectedCategoryId() === cat.id">
        {{ cat.title }}
      </a>
    }
  </nav>
  <mat-tab-nav-panel #tabPanel>
    <main p-md>
      <app-menu-category [category]="category()" />
    </main>
  </mat-tab-nav-panel>
} @else {
  <div p-md w-xs>
    <mat-card appearance="outlined">
      <mat-card-content>
        <app-empty-state
        [icon]="shopService.businessCategoryMenuIcon()"
        [text]="'menu.noCategories' | translate"
        [action]="{
          label: 'menu.manageCategories' | translate,
          icon: 'list',
        }"
        (actionClick)="goToCategories()"
        />
      </mat-card-content>
    </mat-card>
  </div>
}
