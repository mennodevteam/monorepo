<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ 'dashboard.topProductsTitle' | translate }}
    </mat-card-title>
  </mat-card-header>
  <br />
  <mat-card-content>
    @if (query.data()) {
      <canvas baseChart [data]="chartData()" [options]="chartOptions" type="pie" height="300px"></canvas>
    }
  </mat-card-content>
</mat-card>
