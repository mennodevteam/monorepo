<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ 'dashboard.menuStatTitle' | translate }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <canvas
      baseChart
      [data]="chartData()"
      [options]="chartOptions"
      type="line"
      height="130"
    ></canvas>
  </mat-card-content>
</mat-card>
