<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ 'dashboard.menuStatTitle' | translate }}
    </mat-card-title>
    <mat-card-subtitle>
      {{ 'dashboard.menuStatSubtitle' | translate }}
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <canvas baseChart [data]="chartData()" [options]="chartOptions" type="line" height="300"></canvas>
  </mat-card-content>
</mat-card>
