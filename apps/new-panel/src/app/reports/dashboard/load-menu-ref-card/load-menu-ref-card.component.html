<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ 'dashboard.loadMenuRefTitle' | translate }}
    </mat-card-title>
    <button mat-stroked-button id="days-filter" [matMenuTriggerFor]="daysMenu">
      {{ 'dashboard.lastDays' | translate: { value: days() } }}
    </button>

    <mat-menu #daysMenu="matMenu">
      <button mat-menu-item (click)="days.set(3)">
        {{ 'dashboard.lastDays' | translate: { value: 3 } }}
      </button>
      <button mat-menu-item (click)="days.set(7)">
        {{ 'dashboard.lastDays' | translate: { value: 7 } }}
      </button>
      <button mat-menu-item (click)="days.set(30)">
        {{ 'dashboard.lastDays' | translate: { value: 30 } }}
      </button>
      <button mat-menu-item (click)="days.set(90)">
        {{ 'dashboard.lastDays' | translate: { value: 90 } }}
      </button>
    </mat-menu>
  </mat-card-header>
  <br />
  <mat-card-content>
    @if (query.data()) {
      <canvas baseChart [data]="chartData()" [options]="chartOptions" type="pie" height="300"></canvas>
    }
  </mat-card-content>
</mat-card>
