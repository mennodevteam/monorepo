<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ 'dashboard.menuStatTitle' | translate }}
    </mat-card-title>
    <mat-card-subtitle>
      {{ 'dashboard.menuStatSubtitle' | translate }}
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    @if (query.data()) {
      <div style="height: 300px; position: relative; width: 100%;">
        <canvas baseChart [data]="chartData()" [options]="chartOptions" type="line"></canvas>
      </div>
    }
  </mat-card-content>
</mat-card>
