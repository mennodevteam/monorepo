<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      {{ 'dashboard.loadMenuRefTitle' | translate }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (query.data()) {
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutAlign="space-between center" fxLayoutGap="16px">
        <!-- Sources List -->
        <mat-list fxFlex="45" style="max-height: 140px; overflow-y: auto; width: 100%;">
          @for (item of query.data(); track item.source; let i = $index) {
            <mat-list-item style="height: 32px !important; display: block;">
              <div fxLayout="row" fxLayoutAlign="space-between center" style="width: 100%; height: 100%;">
                <span matListItemLine style="font-size: 0.78rem; display: inline-flex; align-items: center;">
                  <span class="source-bullet" [style.background-color]="borderColors[i]"></span>
                  {{ item.source || ('dashboard.direct' | translate) }}
                </span>
                <span matListItemMeta eng style="font-size: 0.78rem; margin-inline-start: auto; font-weight: 500;">{{ item.count | number }}</span>
              </div>
            </mat-list-item>
          }
        </mat-list>

        <!-- Pie Chart -->
        <div fxFlex="50" fxLayout="row" fxLayoutAlign="center center" style="height: 140px;">
          <canvas baseChart [data]="chartData()" [options]="chartOptions" type="pie" style="max-height: 130px; max-width: 130px;"></canvas>
        </div>
      </div>
    } @else {
      <app-data-loading />
    }
  </mat-card-content>
</mat-card>
