<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ 'dashboard.orderFunnelTitle' | translate }}</mat-card-title>
    <mat-card-subtitle>{{ 'dashboard.orderConversionRate' | translate }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    @if (query.data()) {
      <canvas baseChart [data]="chartData()" [options]="chartOptions" type="bar"></canvas>
    } @else {
      <app-data-loading />
    }
  </mat-card-content>
</mat-card>
