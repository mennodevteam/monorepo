@let charge = shopService.data()?.smsAccount?.charge || 0;

<mat-card appearance="outlined" class="sms-charge-card">
  <mat-card-header>
    <mat-card-title>
      <ng-icon name="saxMessageOutline"></ng-icon>
      <span spacer-sm></span>
      {{ 'home.wallet.title' | translate }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="form-theme">
    <mat-list>
      <mat-list-item>
        <span matListItemLine>
          {{ 'home.plan.charge' | translate }}
          <ng-icon name="saxInfoCircleOutline" (click)="walletHelp()"></ng-icon>
        </span>
        <span matListItemMeta>
          {{ charge | number: '1.0-0' | menuCurrency }}
          @if (charge < 30000) {
            <ng-icon name="saxDangerOutline" class="fa-large" matTooltip="{{ 'home.plan.lowChargeTooltip' | translate }}"></ng-icon>
          }
        </span>
      </mat-list-item>
    </mat-list>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button type="button" (click)="chargeSmsAccount()">
      {{ 'home.plan.charge' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
