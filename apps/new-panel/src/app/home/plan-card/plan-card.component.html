<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <i class="fa-solid fa-calendar-heart fa-xl"></i>
      <span spacer-sm></span>
      {{ 'home.plan.serviceTitle' | translate }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="form-theme">
    <mat-list>
      <mat-list-item>
        <span matListItemLine>{{ 'home.plan.yourPlan' | translate }}</span>
        <span matListItemMeta>
          {{ 'home.plan.remainDays' | translate: { value: remainingDays() | number: '1.0-0' } }}
        </span>
      </mat-list-item>
    </mat-list>
    @if (remainingDays() < 8) {
      <mat-card class="warning-card" [class.error]="remainingDays() <= 0" appearance="outlined">
        <mat-card-content>{{
          (remainingDays() <= 0 ? 'home.plan.expiredWarning' : 'home.plan.expireWarning') | translate
        }}</mat-card-content>
      </mat-card>
    }
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button type="button" (click)="buyPlan()">
      {{ 'home.plan.buy' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
