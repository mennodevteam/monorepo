<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>
      <ng-icon name="saxCalendarOutline"></ng-icon>
      <span spacer-sm></span>
      {{ 'home.plan.serviceTitle' | translate }}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="form-theme">
    <mat-list>
      <mat-list-item>
        <span matListItemLine>{{ 'home.plan.yourPlan' | translate }}</span>
        <span matListItemMeta>
          {{ 'home.plan.remainDays' | translate: { value: remainingDays() | number: '1.0-0' } }}
        </span>
      </mat-list-item>
    </mat-list>
    @if (remainingDays() < 8) {
      <app-alert [type]="remainingDays() <= 0 ? 'error' : 'warning'">
        {{ (remainingDays() <= 0 ? 'home.plan.expiredWarning' : 'home.plan.expireWarning') | translate }}
      </app-alert>
    }
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button type="button" (click)="buyPlan()">
      {{ 'home.plan.buy' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
