<mat-card appearance="outlined">
  <mat-card-header>
    <img mat-card-avatar imageLoader [imageFile]="shopService.data()?.logoImage" />
    <mat-card-title>{{ shopService.data()?.title }}</mat-card-title>
    <mat-card-subtitle class="blue">
      {{ 'home.code' | translate }}:
      <span class="eng">{{ shopService.data()?.code }}</span>
    </mat-card-subtitle>
  </mat-card-header>
  <mat-divider></mat-divider>
  <mat-card-content>
    <mat-nav-list>
      <a mat-list-item [href]="shopService.appLink()" target="_blank">
        <i matListItemIcon class="fa-solid fa-arrow-up-right-from-square"></i>
        <span matListItemTitle>{{ 'home.appLink' | translate }}</span>
        <a matListItemLine>{{ shopService.appLink() }}</a>
      </a>
    </mat-nav-list>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-actions>
    <button mat-button color="primary">
      {{ 'home.sendAppLink' | translate }}
    </button>
  </mat-card-actions>
</mat-card>
