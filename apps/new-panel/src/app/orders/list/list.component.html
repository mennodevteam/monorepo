<mat-toolbar class="content-toolbar order-list-toolbar">
  <div class="order-list-toolbar__filters">
    <div class="order-list-toolbar__date-wrap">
      <div class="order-list-toolbar__date-anchor" aria-hidden="true">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-date-range-input [rangePicker]="orderDateRangePicker">
            <input
              matStartDate
              name="orderListFromDate"
              [ngModel]="fromDate()"
              (ngModelChange)="fromDate.set($event)"
              tabindex="-1"
            />
            <input
              matEndDate
              name="orderListToDate"
              [ngModel]="toDate()"
              (ngModelChange)="toDate.set($event)"
              tabindex="-1"
            />
          </mat-date-range-input>
          <mat-date-range-picker #orderDateRangePicker></mat-date-range-picker>
        </mat-form-field>
      </div>
      <button
        mat-stroked-button
        type="button"
        class="order-list-toolbar__filter-btn"
        (click)="orderDateRangePicker.open()"
        matBadgeSize="small"
        [matBadge]="1"
        [matBadgeHidden]="!(fromDate() || toDate())"
      >
        <ng-icon name="saxCalendarOutline" aria-hidden="true"></ng-icon>
        <span>{{ 'order.list.dateRangeButton' | translate }}</span>
      </button>
    </div>
    <button
      mat-stroked-button
      type="button"
      class="order-list-toolbar__filter-btn"
      (click)="openExtraFiltersDialog()"
      matBadgeSize="small"
      [matBadge]="extraFiltersBadgeCount()"
      [matBadgeHidden]="extraFiltersBadgeCount() === 0"
    >
      <ng-icon name="saxSetting5Outline" aria-hidden="true"></ng-icon>
      <span>{{ 'order.list.moreFilters' | translate }}</span>
    </button>
    @if (hasActiveFilters()) {
      <button mat-stroked-button type="button" color="warn" class="order-list-toolbar__clear-all" (click)="clearAllFilters()">
        <ng-icon name="saxCloseCircleOutline" aria-hidden="true"></ng-icon>
        <span>{{ 'order.list.clearAllFilters' | translate }}</span>
      </button>
    }
  </div>
  <span fxFlex></span>
  <button mat-flat-button routerLink="../new">
    {{ 'newOrder.newTitle' | translate }}
  </button>
</mat-toolbar>

<main p-md class="order-list-main">
  <mat-card appearance="outlined" class="order-list-card">
    <mat-card-content>
      @if (query.data() && query.data()![0]?.length === 0) {
        <app-empty-state
          [text]="'order.list.emptyState' | translate"
          icon="file-invoice"
        />
      } @else {
        @if (isMobile()) {
          <app-order-card-view
            [orders]="query.data()?.[0] || []"
            (stateChange)="stateChange($event.order, $event.state)"
          />
        } @else {
          <app-order-table
            [orders]="query.data()?.[0] || []"
            (stateChange)="stateChange($event.order, $event.state)"
            (delete)="delete($event)"
          />
        }
      }
      @if (!query.data()) {
        <app-data-loading />
      }

      <mat-paginator
        [pageSize]="currentSize()"
        [pageIndex]="currentPage()"
        [length]="pageSize()"
        [pageSizeOptions]="[25, 50, 100]"
        showFirstLastButtons
        (page)="pageChange($event)"
      />
    </mat-card-content>
  </mat-card>
</main>
