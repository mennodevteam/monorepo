<mat-card appearance="outlined">
  <mat-card-content>
    <div
      class="map-container"
      leaflet
      [leafletOptions]="options"
      leafletDraw
      [leafletDrawOptions]="drawOptions"
      (leafletDrawCreated)="onDrawCreated($event)"
      (leafletDrawEdited)="onDrawEdited($event)"
      (leafletDrawDeleteStart)="onDrawDeleted($event)"
    >
      <div [leafletLayer]="drawItems"></div>
    </div>
  </mat-card-content>>
</mat-card>
