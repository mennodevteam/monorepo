<div fxLayout="column" fxLayoutAlign="center center" p-md fxLayoutGap="16px">
  @if (icon()) {
    <i class="icon fa-duotone fa-{{ icon() }}"></i>
  }
  <p>{{ text() }}</p>
  @if (action()) {
    <button mat-flat-button color="primary" (click)="actionClick.emit()">
      @if (action()?.icon) {
        <i class="fa-regular fa-{{ action()?.icon }}"></i>
      }
      {{ action()?.label }}
    </button>
  }
</div>
