<div fxLayout="column" fxLayoutAlign="center center" p-md fxLayoutGap="16px" w-xs class="container">
  @if (icon()) {
    <ng-icon [name]="getIconName(icon())" class="icon"></ng-icon>
  }
  @if (typeof text() === 'string') {
    <p>{{ text() }}</p>
  } @else {
    <div>
      @for (line of text(); track line) {
        <p>{{ line }}</p>
      }
    </div>
  }
  @if (action()) {
    <button mat-flat-button color="primary" (click)="actionClick.emit()">
      @if (action()?.icon) {
        <ng-icon [name]="getIconName(action()?.icon)" style="margin-inline-end: 4px; vertical-align: middle;"></ng-icon>
      }
      {{ action()?.label }}
    </button>
  }
</div>
