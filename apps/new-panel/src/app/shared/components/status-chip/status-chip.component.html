<mat-chip [ngClass]="'status_' + status()" [matMenuTriggerFor]="menu" [disabled]="disabled()">
  @switch (status()) {
    @case (Status.Active) {
      <ng-icon name="saxTickCircleOutline"></ng-icon>
    }
    @case (Status.Inactive) {
      <ng-icon name="saxCloseCircleOutline"></ng-icon>
    }
    @case (Status.Blocked) {
      <ng-icon name="saxForbiddenOutline"></ng-icon>
    }
  }
  @if (title()) {
    {{ title() }}:
  }
  {{ 'menu.status.' + status() | translate }}
</mat-chip>
<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="statusChange.emit(Status.Active)" [disabled]="status() === Status.Active">
    <ng-icon name="saxTickCircleOutline"></ng-icon>
    {{ 'menu.status.' + Status.Active | translate }}
  </button>
  <button
    mat-menu-item
    (click)="statusChange.emit(Status.Inactive)"
    [disabled]="status() === Status.Inactive"
  >
    <ng-icon name="saxCloseCircleOutline"></ng-icon>
    {{ 'menu.status.' + Status.Inactive | translate }}
  </button>
  @if (!justActiveInActive()) {
    <button
      mat-menu-item
      (click)="statusChange.emit(Status.Blocked)"
      [disabled]="status() === Status.Blocked"
    >
      <ng-icon name="saxForbiddenOutline"></ng-icon>
      {{ 'menu.status.' + Status.Blocked | translate }}
    </button>
  }
</mat-menu>
