<h2>{{ 'menu.selectDineInTable' | translate }}</h2>
<mat-nav-list>
  @for (table of tables; track table; let last = $last) {
    <a mat-list-item (click)="sheetRef.dismiss(table)">
      <h3 matLine>
        {{ table.code }}
        @if (table.title) {
          <span>({{ table.title }})</span>
        }
      </h3>
      @if (!last) {
        <mat-divider></mat-divider>
      }
    </a>
  }
</mat-nav-list>
