<div class="table-container">
  <!-- Table -->
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="data()" matSort class="shops-table">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let shop">{{ shop.id.slice(0, 6) }}..</td>
      </ng-container>

      <!-- Title Column -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Shop Name</th>
        <td mat-cell *matCellDef="let shop">{{ shop.title }}</td>
      </ng-container>

      <!-- Username Column -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
        <td mat-cell *matCellDef="let shop">{{ shop.username }}</td>
      </ng-container>

      <!-- Address Column -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Address</th>
        <td mat-cell *matCellDef="let shop">{{ shop.region.title }}</td>
      </ng-container>

      <!-- Phones Column -->
      <ng-container matColumnDef="phones">
        <th mat-header-cell *matHeaderCellDef>Phone</th>
        <td mat-cell *matCellDef="let shop">{{ getPhoneNumber(shop) }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let shop">
          <mat-chip [color]="getStatusColor(shop.status)" selected>
            {{ getStatusText(shop.status) }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Created Date</th>
        <td mat-cell *matCellDef="let shop">{{ shop.createdAt | date: 'shortDate' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let shop">
          <button mat-icon-button [matMenuTriggerFor]="actionMenu">
            <i class="far fa-ellipsis-v"></i>
          </button>
          <mat-menu #actionMenu="matMenu">
            <button mat-menu-item (click)="editShop(shop)">
              <i class="far fa-edit"></i>
              Edit
            </button>
            <button mat-menu-item (click)="viewShop(shop)">
              <i class="far fa-eye"></i>
              View
            </button>
            <button mat-menu-item (click)="toggleShopStatus(shop)">
              <i class="far fa-{{ shop.status === 'active' ? 'ban' : 'check-circle' }}"></i>
              {{ shop.status === 'active' ? 'Deactivate' : 'Activate' }}
            </button>
            <button mat-menu-item (click)="deleteShop(shop)" class="delete-action">
              <i class="far fa-trash-alt"></i>
              Delete
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
