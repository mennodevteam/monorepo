<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>customer</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <link rel="icon" type="image/x-icon" id="app-favicon" href="favicon.ico" />
    <link rel="manifest" id="my-manifest-placeholder" />
  </head>
  <body>
    <app-root></app-root>
    <div
      id="pre-load-data-container"
      style="
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        gap: 24px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000;
        opacity: 1;
        transition: 300ms;
        background-color: white;
      "
    ></div>

    <script>
      const backgroundColor = localStorage.getItem('appBackgroundColor');
      if (backgroundColor) {
        document.body.style.backgroundColor = backgroundColor;
        document.getElementById('pre-load-data-container').style.backgroundColor = backgroundColor;
      }
    </script>

    <script>
      fetch('https://api.menno.pro/shops/baseInfo2/' + location.hostname)
        .then((response) => {
          return response.json();
        })
        .then((shop) => {
          if (shop) {
            const title = shop?.seo?.title || shop?.title;
            const description = shop?.seo?.description || shop?.description;
            const fav = shop?.fav;
            const scripts = shop?.scripts;

            if (title) document.title = title;

            if (description) {
              const metaDescription = document.querySelector('meta[name="description"]');
              if (metaDescription) {
                metaDescription.setAttribute('content', description);
              } else {
                const newMetaDescription = document.createElement('meta');
                newMetaDescription.name = 'description';
                newMetaDescription.content = description;
                document.head.appendChild(newMetaDescription);
              }
            }

            if (fav) {
              const faviconLink = document.querySelector('link[rel="icon"]');
              if (faviconLink) {
                faviconLink.href = fav;
              } else {
                const newFaviconLink = document.createElement('link');
                newFaviconLink.rel = 'icon';
                newFaviconLink.href = fav;
                document.head.appendChild(newFaviconLink);
              }
            }

            const div = document.querySelector(`#pre-load-data-container`);
            if (div) {
              if (!document.getElementById('preload-typing-style')) {
                const style = document.createElement('style');
                style.id = 'preload-typing-style';
                style.textContent = `
                  .preload-typing-cursor {
                    display: inline-block;
                    margin-inline-start: 2px;
                    opacity: 1;
                    animation: preload-cursor-blink 900ms step-end infinite;
                  }
                  @keyframes preload-cursor-blink {
                    50% { opacity: 0; }
                  }
                `;
                document.head.appendChild(style);
              }

              const preloadTitle = title || '';

              const h1 = document.createElement('h1');
              h1.style.fontSize = '24px';
              h1.style.margin = '0';
              h1.style.textAlign = 'center';

              const typedText = document.createElement('span');
              const cursor = document.createElement('span');
              cursor.className = 'preload-typing-cursor';
              cursor.textContent = '|';
              h1.append(typedText, cursor);

              const logo = document.createElement('img');
              logo.src = shop.logo || '';
              logo.alt = shop.title || preloadTitle || 'logo';
              logo.style.borderRadius = '24px';
              logo.style.width = '180px';
              logo.style.height = '180px';
              logo.style.opacity = '0';
              logo.style.transform = 'translateY(8px)';
              logo.style.transition = 'opacity 260ms ease, transform 260ms ease';
              logo.onerror = () => {
                logo.style.display = 'none';
              };

              div.replaceChildren(h1, logo);

              const showLogo = () => {
                cursor.style.display = 'none';
                logo.style.opacity = '1';
                logo.style.transform = 'translateY(0)';
              };

              if (!preloadTitle) {
                showLogo();
              } else {
                let index = 0;
                const typingTimer = window.setInterval(() => {
                  index += 1;
                  typedText.textContent = preloadTitle.slice(0, index);

                  if (index >= preloadTitle.length) {
                    window.clearInterval(typingTimer);
                    window.setTimeout(showLogo, 220);
                  }
                }, 40);
              }
            }

            if (scripts) {
              for (const script of scripts) {
                try {
                  // Check if script is active before executing
                  if (script.active !== false) {
                    if (script.head) {
                      const scriptContent = decodeURIComponent(script.head);

                      // Check if content already contains <script> tags
                      const scriptTagRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                      const hasScriptTags = scriptTagRegex.test(scriptContent);

                      if (hasScriptTags) {
                        // Add content directly to head (including script tags)
                        document.head.insertAdjacentHTML('beforeend', scriptContent);
                      } else {
                        // Create script element for raw JavaScript
                        const scriptElement = document.createElement('script');
                        scriptElement.innerHTML = scriptContent;
                        document.head.appendChild(scriptElement);
                      }
                    }
                    if (script.body) {
                      const scriptContent = decodeURIComponent(script.body);

                      // Check if content already contains <script> tags
                      const scriptTagRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                      const hasScriptTags = scriptTagRegex.test(scriptContent);

                      if (hasScriptTags) {
                        // Add content directly to body (including script tags)
                        document.body.insertAdjacentHTML('beforeend', scriptContent);
                      } else {
                        // Create script element for raw JavaScript
                        const scriptElement = document.createElement('script');
                        scriptElement.innerHTML = scriptContent;
                        document.body.appendChild(scriptElement);
                      }
                    }
                  }
                } catch (error) {
                  console.error(error);
                }
              }
            }
          }
        })
        .catch(() => {
          const div = document.querySelector(`#pre-load-data-container`);
          if (div) {
            div.remove();
          }
        });
    </script>
  </body>
</html>
