<div class="shell-container">
  <app-top-app-bar class="shell-app-bar"></app-top-app-bar>
  @if (loading()) {
    <div class="loading-overlay">
      <p>Loading...</p>
    </div>
  }
  <main class="shell-content" [class.no-bottom-nav]="hideBottomNav()">
    <router-outlet></router-outlet>
  </main>
  @if (!hideBottomNav()) {
    <app-bottom-navigation></app-bottom-navigation>
  }
</div>
