<div class="shell-container">
  <app-top-app-bar class="shell-app-bar" [hideMetaAction]="hideMetaAction()"></app-top-app-bar>
  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="24"></mat-spinner>
    </div>
  }
  <main class="shell-content" [class.no-bottom-nav]="hideBottomNav()">
    <router-outlet></router-outlet>
  </main>
  <app-bottom-navigation
    [visible]="!hideBottomNav()"
  ></app-bottom-navigation>
</div>
