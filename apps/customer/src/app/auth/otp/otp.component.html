<app-top-app-bar [hideMetaAction]="true" />
<div class="otp-container">
  <h1>کد تایید</h1>
  <p>کد ارسال شده به شماره {{ phone }} را وارد کنید</p>

  <mat-form-field appearance="outline">
    <input
      matInput
      type="text"
      inputmode="numeric"
      [(ngModel)]="otp"
      class="otp-input"
      autocomplete="one-time-code"
      [disabled]="loading()"
      autofocus
    />
  </mat-form-field>

  <div class="actions">
    <button mat-flat-button color="primary" type="button" (click)="setToken()" [disabled]="loading() || !hasOtpValue()">
      تایید کد
    </button>
    <button matButton type="button" (click)="sendTokenAgain()" [disabled]="time() > 0 || loading()">
      @if (time() > 0) {
        ارسال مجدد در {{ time() }} ثانیه
      } @else {
        ارسال مجدد
      }
    </button>
  </div>

  @if (loading()) {
    <mat-spinner diameter="24" class="spinner"></mat-spinner>
  }
</div>
