@if (images().length > 0) {
  <div class="banner-container" [class.full-width]="fullWidth()" [class]="aspectRatioClass()">
    @for (image of images(); track $index) {
      <div class="banner-image-wrapper" [class.clickable]="links()[$index]">
        <img
          appImageLoader
          [imageFile]="image"
          imageSize="md"
          [attr.alt]="'Banner image ' + ($index + 1)"
          (click)="handleImageClick($index)"
        />
      </div>
    }
  </div>
}
