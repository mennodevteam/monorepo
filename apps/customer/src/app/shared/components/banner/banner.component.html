@if (images().length > 0) {
  <div class="banner-wrapper" [class.not-first]="!isFirst()">
    <div class="banner-container" #carousel (scroll)="onCarouselScroll()" [class.full-width]="fullWidth()" [attr.data-aspect-ratio]="aspectRatio()">
      @for (image of images(); track $index) {
        @if (getBannerHref($index); as href) {
          @if (isExternalHref(href)) {
            <a class="banner-slide-link" [href]="href" target="_blank" rel="noopener noreferrer">
              <img
                appImageLoader
                [imageFile]="image"
                imageSize="origin"
                [attr.alt]="'Banner image ' + ($index + 1)"
              />
            </a>
          } @else {
            <a class="banner-slide-link" [routerLink]="href">
              <img
                appImageLoader
                [imageFile]="image"
                imageSize="origin"
                [attr.alt]="'Banner image ' + ($index + 1)"
              />
            </a>
          }
        } @else {
          <img
            appImageLoader
            [imageFile]="image"
            imageSize="origin"
            [attr.alt]="'Banner image ' + ($index + 1)"
          />
        }
      }
    </div>

    @if (images().length > 1) {
      <div class="carousel-dots">
        @for (image of images(); track $index) {
          <button
            type="button"
            class="carousel-dot"
            [class.active]="$index === activeImageIndex()"
            [attr.aria-label]="'اسلاید ' + ($index + 1)"
            (click)="scrollToIndex($index)"
          ></button>
        }
      </div>
    }
  </div>
}
