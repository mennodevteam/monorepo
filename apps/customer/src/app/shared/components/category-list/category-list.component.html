@if (visibleCategories().length) {
  <mat-grid-list cols="2" rowHeight="1:1">
    @for (category of visibleCategories(); track category.id) {
      <mat-grid-tile 
        [routerLink]="['/categories', category.id]"
        class="category-tile"
        [imageFile]="category.imageFile ?? undefined"
        [imageSize]="'md'"
        imageLoader
      >
      <mat-grid-tile-footer class="category-tile-footer">
        {{ category.title }}
      </mat-grid-tile-footer>
      </mat-grid-tile>
    }
  </mat-grid-list>
} @else {
  <p class="category-list__empty">دسته‌بندی فعالی وجود ندارد.</p>
}
