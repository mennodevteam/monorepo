<form [formGroup]="form" (ngSubmit)="submit()">
  <h3>کد تخفیف</h3>
  <p>کد تخفیف خود را وارد کنید</p>

  <mat-form-field appearance="outline">
    <mat-label>کد تخفیف</mat-label>
    <input matInput formControlName="code" [disabled]="loading()" ltr mono autofocus />
    @if (form.get('code')?.hasError('required') && form.get('code')?.touched) {
      <mat-error>لطفا کد تخفیف را وارد کنید</mat-error>
    }
  </mat-form-field>

  <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">
    @if (loading()) {
      <mat-spinner diameter="16"></mat-spinner>
    } @else {
      <span>اعمال کد</span>
    }
  </button>
  <button mat-stroked-button type="button" (click)="cancel()" [disabled]="loading()">انصراف</button>
</form>
