<div class="container">
  @if (icon()) {
    <div class="icon-wrap">
      <ng-icon [svg]="icon()!" size="64" class="icon"></ng-icon>
    </div>
  }
  @if (title()) {
    <h2 class="title">{{ title() }}</h2>
  }
  <p class="text">{{ text() }}</p>
  @if (actionLabel()) {
    <button mat-flat-button color="primary" (click)="actionClick.emit()">
      {{ actionLabel() }}
    </button>
  }
</div>
