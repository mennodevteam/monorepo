<div class="container">
  @if (icon()) {
    <ng-icon [svg]="icon()!" size="120" class="icon"></ng-icon>
  }
  <p class="mat-body-medium mat-color-on-surface-variant">{{ text() }}</p>
  @if (actionLabel()) {
    <button mat-flat-button color="primary" (click)="actionClick.emit()">
      {{ actionLabel() }}
    </button>
  }
</div>
