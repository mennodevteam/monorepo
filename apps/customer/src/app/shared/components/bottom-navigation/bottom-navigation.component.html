<mat-toolbar class="bottom-nav">
  @for (item of navItems; track item.path) {
    <button
      mat-button
      [routerLink]="item.path"
      routerLinkActive="active"
      class="nav-button"
    >
      <mat-icon class="material-icons-rounded">{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </button>
  }
</mat-toolbar>
