<mat-toolbar [class.sticky]="sticky()">
  @if (!isRootPage()) {
    <button mat-icon-button appGoBack>
      <ng-icon [svg]="backIcon"></ng-icon>
    </button>
  } @else {
    @if (shopLogoUrl(); as logo) {
      <img [appImageLoader]="logo" [alt]="shopTitle()" />
    }
  }
  <h1>
    {{ displayTitle() }}
  </h1>

  <span class="spacer"></span>
  @if (!hideMetaAction()) {
    <button mat-icon-button routerLink="/search">
      <ng-icon [svg]="searchIcon"></ng-icon>
    </button>
    <button mat-icon-button routerLink="/cart">
      <ng-icon
        [svg]="cartIcon"
        [matBadge]="cart.length()"
        matBadgeColor="warn"
        [matBadgeHidden]="cart.length() === 0"
      ></ng-icon>
    </button>
  }
</mat-toolbar>
