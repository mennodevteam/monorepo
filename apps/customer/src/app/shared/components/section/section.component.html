<section class="section">
  <mat-toolbar appearance="flat" class="section__toolbar">
    @if (icon()) {
      <ng-icon [svg]="icon()" size="24"></ng-icon>
    }
    <h2 class="section__title">{{ title() }}</h2>

    @if (seeMoreLabel()) {
      <a [routerLink]="routerLink()" mat-button (click)="seeMoreClick?.emit()">
        {{ seeMoreLabel() }}
      </a>
    }
  </mat-toolbar>

  <div class="section__content">
    <ng-content></ng-content>
  </div>
</section>
