@if (products().length > 0) {
  <app-section [title]="title() || ''">
    @if (isCarousel()) {
      <div class="product-list-carousel-container">
        <div class="product-list-carousel">
          @for (product of products(); track product.id) {
            <div class="product-list-carousel-item">
              <app-product-card [product]="product" [largeImage]="false" [hideVariants]="true" />
            </div>
          }
        </div>
      </div>
    } @else if (isGrid()) {
      <mat-grid-list [cols]="gridCols()" rowHeight="1:1" gutterSize="8">
        @for (product of products(); track product.id) {
          <mat-grid-tile
            [routerLink]="['/product', product.id]"
            class="product-tile"
            [imageFile]="getProductImage(product)"
            [imageSize]="'md'"
            appImageLoader
          >
            <mat-grid-tile-footer class="product-tile-footer">
              {{ product.title }}
            </mat-grid-tile-footer>
          </mat-grid-tile>
        }
      </mat-grid-list>
    }
  </app-section>
}
