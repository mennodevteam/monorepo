<div class="page-container">
  @if (menuQuery.isPending()) {
    <div class="state state--loading">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else if (menuQuery.isError()) {
    <div class="state state--error">مشکلی در دریافت دسته‌بندی‌ها رخ داد. لطفاً دوباره تلاش کنید.</div>
  } @else {
    @if (hasCategories()) {
      <mat-grid-list cols="2" rowHeight="1:1" gutterSize="8">
        @for (category of categories(); track category.id) {
          <mat-grid-tile
            [routerLink]="['/categories', category.id]"
            class="category-tile"
            [imageFile]="category.imageFile ?? undefined"
            [imageSize]="'md'"
            appImageLoader
          >
            <mat-grid-tile-footer class="category-tile-footer">
              {{ category.title }}
            </mat-grid-tile-footer>
          </mat-grid-tile>
        }
      </mat-grid-list>
    } @else {
      <div class="state state--empty">هنوز دسته‌بندی‌ای در این منو ثبت نشده است.</div>
    }
  }
</div>
