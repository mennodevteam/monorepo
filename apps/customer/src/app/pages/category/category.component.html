<div class="page-container">
  @if (isLoading()) {
    <div class="state state--loading">
      <mat-progress-spinner diameter="32" mode="indeterminate" />
    </div>
  } @else {
    <section class="category-header">
      <h1 class="category-header__title">{{ category()?.title }}</h1>
      @if (category()?.description) {
        <p class="category-header__description">{{ category()?.description }}</p>
      }
    </section>

    @if (hasProducts()) {
      <div class="product-container" [class.grid]="isGrid()">
        @for (product of products(); track product.id) {
          <app-product-card
            [product]="product"
            [showAddToCart]="isCard()"
            [showVariants]="isCard()"
            [showVariants]="isCard()"
            [showDescription]="isCard()"
            [compact]="isGrid()"
            [largeImage]="categoryType() === MenuViewType.CardLargeImage || isGrid()"
          />
        }
      </div>
    } @else {
      <div class="state state--empty">هنوز محصولی برای این دسته‌بندی ثبت نشده است.</div>
    }
  }
</div>
