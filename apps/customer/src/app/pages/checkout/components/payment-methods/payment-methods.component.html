<section class="container">
  @if (availablePaymentMethodsCount > 1) {
    <mat-selection-list [multiple]="false" class="payment-list">
      @if (hasOnlinePayment) {
        <mat-list-option
          [selected]="selectedPaymentType === OrderPaymentType.Online"
          (click)="onPaymentTypeChange(OrderPaymentType.Online)"
        >
          پرداخت آنلاین
        </mat-list-option>
      }

      @if (hasCashPayment) {
        <mat-list-option
          [selected]="selectedPaymentType === OrderPaymentType.Cash"
          (click)="onPaymentTypeChange(OrderPaymentType.Cash)"
        >
          پرداخت نقدی
        </mat-list-option>
      }
    </mat-selection-list>
  } @else if (availablePaymentMethodsCount === 1) {
    <div class="payment-description">
      {{ singlePaymentMethodDescription }}
    </div>
  }

  @if (club.wallet?.charge) {
    <mat-checkbox class="wallet-toggle" [checked]="cart.useWallet()" (change)="onWalletChange($event.checked)">
      استفاده از کیف پول
      <span class="mat-title-small" style="margin-right: 8px">{{ club.wallet?.charge | number }} تومان</span>
    </mat-checkbox>
  }
</section>
