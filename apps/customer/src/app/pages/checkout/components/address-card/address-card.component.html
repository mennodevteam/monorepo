@if (address(); as addressValue) {
  <div class="address-summary">
    <div class="address-title">
      @if (addressValue.title) {
        {{ addressValue.title }}
      } @else {
        {{ addressValue.region?.title }}
      }
    </div>
    <p class="address-description">{{ addressValue.description }}</p>
    @if (addressValue.deliveryArea?.label) {
      <span class="delivery-area-label">
        {{ addressValue.deliveryArea?.label }}
      </span>
    }
  </div>
}
