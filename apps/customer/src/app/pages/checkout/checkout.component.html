<app-top-app-bar title="تکمیل سفارش" [sticky]="true" [hideMetaAction]="true"></app-top-app-bar>

@if (cart.length()) {
  <main class="main-content">
    <app-section title="آدرس تحویل" [icon]="addressIcon" seeMoreLabel="تغییر آدرس" routerLink="/addresses">
      @if (cart.address(); as address) {
        <mat-card appearance="outlined">
          <mat-card-header>
            <mat-card-title>
              @if (address.title) {
                {{ address.title }}:
              } @else {
                {{ address.region?.title }}
              }
            </mat-card-title>
          </mat-card-header>
          <mat-card-content>
            {{ address.description }}
          </mat-card-content>
        </mat-card>
      }
    </app-section>

    <!-- Invoice Section -->
    <app-section title="صورتحساب" [icon]="invoiceIcon">
      <app-invoice></app-invoice>
    </app-section>

    <!-- Payment Methods Section -->
    <app-payment-methods></app-payment-methods>
  </main>
}

<mat-toolbar class="action-toolbar">
  <button mat-raised-button (click)="submit()" [disabled]="cart.saving()">
    @if (cart.saving()) {
      <span>در حال ثبت...</span>
    } @else {
      <span>ثبت سفارش ({{ total() | number }} تومان)</span>
    }
  </button>
</mat-toolbar>
