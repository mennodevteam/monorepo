<app-top-app-bar title="چیزی جا ننداختی؟" [sticky]="true" [hideMetaAction]="true" [hideLeft]="true">
  <button mat-stroked-button (click)="skip()">رد کردن</button>
</app-top-app-bar>

<div class="page-container">
  <p class="missed-products-hint">
    این محصولات با آیتم‌های سبد خرید شما مرتبط هستند.
  </p>

  <div class="missed-products-list">
    @for (product of missedProducts(); track product.id) {
      <app-product-card [product]="product" [largeImage]="false" [hideVariants]="false" />
    }
  </div>

  <mat-toolbar class="action-toolbar">
    <button mat-raised-button (click)="proceedToCheckout()">
      تکمیل خرید
    </button>
  </mat-toolbar>
</div>
