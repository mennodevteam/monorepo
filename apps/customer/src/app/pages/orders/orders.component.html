<div class="page-container">
  <div class="orders-container">
    @if (query.isPending()) {
      <div class="loading-state">
        <mat-spinner diameter="24"></mat-spinner>
      </div>
    }

    @if (query.data()) {
      <mat-nav-list class="orders-list">
        @for (page of query.data()?.pages; track $index) {
          @for (order of page; track order.id) {
            <a mat-list-item [routerLink]="['/orders', order.id]" class="order-item">
              <img
                matListItemAvatar
                [appImageLoader]="order.shop?.logo"
                [alt]="order.shop?.title"
                class="order-logo"
              />
              <span matListItemTitle>{{ order.shop?.title }}</span>
              <span matListItemLine>
                {{ order.createdAt | pdate: true }}
              </span>
              <div matListItemMeta class="order-price">
                <span>{{ order.totalPrice | number }} تومان</span>
              </div>
            </a>
            <mat-divider></mat-divider>
          }
        }
      </mat-nav-list>

      @if (query.hasNextPage()) {
        <div class="load-more-container" #loadMoreTrigger>
          <button mat-button (click)="loadMore()" [disabled]="query.isFetchingNextPage()">
            @if (query.isFetchingNextPage()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              مشاهده بیشتر
            }
          </button>
        </div>
      }
    }
  </div>
</div>
