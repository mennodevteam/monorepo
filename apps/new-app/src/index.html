<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title></title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/x-icon" id="favicon" href="favicon.ico" />
    <link rel="manifest" id="my-manifest-placeholder" />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="mat-app-background" class="dark">
    <app-root> </app-root>
    <div
      id="pre-load-data-container"
      style="
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        gap: 24px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000;
        opacity: 1;
        transition: 300ms;
        background-color: white;
      "
    ></div>

    <script>
      const backgroundColor = localStorage.getItem('appBackgroundColor');
      if (backgroundColor) {
        document.body.style.backgroundColor = backgroundColor;
        document.getElementById('pre-load-data-container').style.backgroundColor = backgroundColor;
      }
    </script>

    <script>
      fetch('https://api.menno.pro/shops/baseInfo2/' + location.hostname)
        .then((response) => {
          return response.json();
        })
        .then((shop) => {
          if (shop) {
            const title = shop?.seo?.title || shop?.title;
            const description = shop?.seo?.description || shop?.description;
            const fav = shop?.fav;

            if (title) document.title = title;

            if (description) {
              const metaDescription = document.querySelector('meta[name="description"]');
              if (metaDescription) {
                metaDescription.setAttribute('content', description);
              } else {
                const newMetaDescription = document.createElement('meta');
                newMetaDescription.name = 'description';
                newMetaDescription.content = description;
                document.head.appendChild(newMetaDescription);
              }
            }

            if (fav) {
              const faviconLink = document.querySelector('link[rel="icon"]');
              if (faviconLink) {
                faviconLink.href = fav;
              } else {
                const newFaviconLink = document.createElement('link');
                newFaviconLink.rel = 'icon';
                newFaviconLink.href = fav;
                document.head.appendChild(newFaviconLink);
              }
            }

            const div = document.querySelector(`#pre-load-data-container`);
            if (div) {
              div.innerHTML = `
              <img
                style="border-radius: 24px; width: 180px; height: 180px;"
                src="${shop.logo}"
                alt="${shop.title}"
                onerror="this.style.display='none'"
              />
              <h1 style="font-size: 24px">${shop.title}</h1>`;
            }
          }
        });
    </script>
  </body>
</html>
